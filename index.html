{position:absolute;margin:0;left:3px;width:calc(100% - 6px);font-size:11px;padding:3px 5px;z-index:1}.slot{position:absolute;width:100%;height:42px;border:0;background:transparent;border-radius:0}.slot:hover{background:#eef5ed}.footnote{margin-top:15px;font-size:12px;color:var(--muted)}.students{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.student{background:white;border:1px solid var(--line);border-radius:13px;padding:22px}.student h3{margin:0;font-size:18px}.badge{font-size:11px;background:#edf4ec;padding:3px 8px;border-radius:5px;margin-left:5px}.progress{display:flex;gap:5px;margin:14px 0 8px}.progress i{height:7px;flex:1;border-radius:4px;background:#e8ede5}.progress i.fill{background:#6a987b}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.student .actions{display:flex;gap:6px;margin-top:18px}.search{width:240px;border:1px solid var(--line);padding:9px 12px;border-radius:8px}dialog{border:1px solid var(--line);border-radius:17px;padding:28px;width:460px;max-width:94vw;color:var(--ink);box-shadow:0 25px 100px #15291a33}dialog::backdrop{background:#18362b66}dialog h3{font-size:22px;margin:0 0 17px}label{display:block;font-size:12px;color:#65766c;margin-bottom:13px}input,select,textarea{width:100%;border:1px solid #dce4da;border-radius:8px;padding:10px;background:#fff;color:var(--ink);margin-top:4px}textarea{resize:vertical;min-height:70px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}.danger{color:#ac5049}.message{background:#f3f6ef;border-radius:8px;padding:12px;font-size:12px;margin:12px 0}.hidden{display:none!important}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#264d3e;color:white;border-radius:10px;padding:12px 22px;z-index:10}.notice{border:1px dashed #b9ccba;border-radius:10px;padding:13px 18px;margin-bottom:20px;font-size:13px}.notice button{float:right;padding:2px 9px} @med </style></head><body><aside><div class="brand"><h1>◷ 레슨노트</h1><small>LESSON PLANNER</small></div><nav class="nav"><button id="nav-calendar" class="active" onclick="page='calendar';render()">▦ &nbsp; 수업 시간표</button><button id="nav-students" onclick="page='students';render()">♧ &nbsp; 수강생 관리</button></nav><div class="bottom">나의 수업을 차곡차곡.<br>현재 브라우저에 자동 저장됩니다.<br><button onclick="backup()">백업 내보내기</button><button onclick="document.getElementById('import').click()">복원</button></div></aside><main><header><div><div class="eyebrow">YOUR LESSON, WELL PLANNED</div><h2 id="title">수업 시간표</h2><p>한눈에 살펴보고, 여유롭게 준비하세요.</p></div><button class="primary" onclick="page==='students'?studentForm():lessonForm()" id="add">＋ 수업 등록</button></header><div class="stats" id="stats"></div><div id="content"></div><div class="footnote">아이 30분 · 어른 60분 · 등록 1건당 4회 수업 &nbsp; | &nbsp; 수업을 ‘완료’로 표시하면 회차에 반영됩니다.</div><div class="mobile-backup hidden"><button onclick="backup()">백업</button> <button onclick="document.getElementById('import').click()">복원</button></div></main><input type="file" id="import" accept="application/json" hidden><dialog id="modal"></dialog><div id="toast" hidden></div><script>
const KEY='lesson-note-v1';let data={version:1,students:[],packages:[],lessons:[]},page='calendar',view='month',cursor=new Date(),filter='all',search='';try{const saved=localStorage.getItem(KEY);if(saved)data=JSON.parse(saved)}catch(e){alert('저장 데이터를 읽지 못했습니다. 백업 파일을 확인해 주세요.')}const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,date=s=>new Date(s+'T12:00:00'),plus=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x},minutes=t=>+t.split(':')[0]*60 + +t.split(':')[1],time=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`,student=id=>data.students.find(s=>s.id===id),pack=id=>data.packages.find(p=>p.id===id),count=p=>p.initial+data.lessons.filter(l=>l.packageId===p.id&&l.status==='done').length,current=s=>data.packages.filter(p=>p.studentId===s.id).at(-1),ordered=ls=>ls.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('브라우저 저장에 실패했습니다. 백업을 내려받아 주세요.')}render()}function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,2800)}function closeModal(){$('#modal').close()}function openModal(html){$('#modal').innerHTML=html;$('#modal').showModal()}function filtered(){return data.lessons.filter(l=>filter==='all'||student(l.studentId)?.type===filter)}function stats(){let today=iso(new Date()),month=iso(cursor).slice(0,7);$('#stats').innerHTML=[['이번 달 수업',data.lessons.filter(l=>l.date.startsWith(month)&&l.status!=='cancel').length,'회'],['오늘의 수업',data.lessons.filter(l=>l.date===today&&l.status!=='cancel').length,'회'],['재등록 확인',data.students.filter(s=>count(current(s))>=3).length,'명 · 3회 이상 완료']].map(([a,b,c])=>`<div class="stat"><span>${a}</span><b>${b}<em>${c}</em></b></div>`).join('')}
function render(){stats();$('#title').textContent=page==='calendar'?'수업 시간표':'수강생 관리';$('#add').textContent=page==='calendar'?'＋ 수업 등록':'＋ 수강생 등록';['calendar','students'].forEach(p=>$('#nav-'+p).classList.toggle('active',p===page));if(page==='students'){renderStudents();return}let label=`${cursor.getFullYear()}년 ${cursor.getMonth()+1}월`;let start=plus(cursor,-((cursor.getDay()+6)%7));if(view==='week')label=`${start.getMonth()+1}.${start.getDate()} – ${plus(start,6).getMonth()+1}.${plus(start,6).getDate()}`;$('#content').innerHTML=(!data.students.length?`<div class="notice">첫 수강생을 등록하고 시간표를 시작해 보세요. <button onclick="studentForm()">수강생 등록 →</button></div>`:'')+`<section class="panel"><div class="toolbar"><div class="controls"><strong>${label}</strong><button aria-label="이전" onclick="navigate(-1)">‹</button><button aria-label="다음" onclick="navigate(1)">›</button><button onclick="cursor=new Date();render()">오늘</button></div><div class="controls"><select aria-label="수업 유형 필터" style="width:auto;margin:0" onchange="filter=this.value;render()"><option value="all" ${filter==='all'?'selected':''}>전체 수업</option><option value="child" ${filter==='child'?'selected':''}>아이</option><option value="adult" ${filter==='adult'?'selected':''}>어른</option></select><div class="switch"><button class="${view==='month'?'active':''}" onclick="view='month';render()">월간</button><button class="${view==='week'?'active':''}" onclick="view='week';render()">주간</button></div><button onclick="print()" title="인쇄">인쇄</button></div></div><div class="legend"><span><i class="dot"></i>아이 · 30분</span><span><i class="dot adult"></i>어른 · 60분</span><span>✓ 수업 완료</span></div><div id="calendar"></div></section>`;if(view==='month')renderMonth();else renderWeek(start)}
function navigate(n){if(view==='month')cursor=new Date(cursor.getFullYear(),cursor.getMonth()+n,1);else cursor=plus(cursor,7*n);render()}function ordinal(l){const p=pack(l.packageId);return p.initial+ordered(data.lessons.filter(x=>x.packageId===p.id&&x.status!=='cancel')).findIndex(x=>x.id===l.id)+1}function event(l,style=''){let s=student(l.studentId);return `<button class="event ${s.type} ${l.status}" style="${style}" onclick="event.stopPropagation();lessonForm('${l.id}')"><span>${l.time} ${l.status==='done'?'✓':l.status==='cancel'?'취소':''}</span><b>${esc(s.name)} · ${l.status==='cancel'?'취소':ordinal(l)+'/4회'}</b></button>`}function renderMonth(){let first=new Date(cursor.getFullYear(),cursor.getMonth(),1),start=plus(first,-((first.getDay()+6)%7));let html=['월','화','수','목','금','토','일'].map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<42;i++){let d=plus(start,i),ds=iso(d);html+=`<div class="day ${d.getMonth()!==cursor.getMonth()?'outside':''} ${ds===iso(new Date())?'today':''}" tabindex="0" role="button" aria-label="${ds} 수업 등록" onclick="lessonForm(null,'${ds}')" onkeydown="if(event.target===this && event.key==='Enter')lessonForm(null,'${ds}')"><span class="date">${d.getDate()}</span>${ordered(filtered().filter(l=>l.date===ds)).map(l=>event(l)).join('')}</div>`}$('#calendar').innerHTML=`<div class="month">${html}</div>`}function renderWeek(start){let visible=filtered().filter(l=>l.date>=iso(start)&&l.date<=iso(plus(start,6)));let from=Math.min(480,...visible.map(l=>Math.floor(minutes(l.time)/60)*60)),to=Math.max(1380,...visible.map(l=>Math.ceil((minutes(l.time)+l.duration)/60)*60)),height=(to-from)*1.4;let html='<div class="weekhead"></div>';for(let i=0;i<7;i++){let d=plus(start,i);html+=`<div class="weekhead">${['월','화','수','목','금','토','일'][i]} <b>${d.getDate()}</b></div>`}html+=`<div class="timeline times" style="height:${height}px">`;for(let m=from;m<to;m+=30)html+=`<span>${time(m)}</span>`;html+='</div>';for(let i=0;i<7;i++){let ds=iso(plus(start,i));html+=`<div class="timeline" style="height:${height}px">`;for(let m=from;m<to;m+=30)html+=`<button class="slot" style="top:${(m-from)*1.4}px" title="${ds} ${time(m)} 수업 등록" onclick="lessonForm(null,'${ds}','${time(m)}')"></button>`;html+=visible.filter(l=>l.date===ds).map(l=>event(l,`top:${(minutes(l.time)-from)*1.4}px;height:${l.duration*1.4-3}px`)).join('')+'</div>'}$('#calendar').innerHTML=`<div class="weekscroll"><div class="week">${html}</div></div>`}
function renderStudents(){$('#content').innerHTML=`<div class="row" style="margin-bottom:20px"><p>${data.students.length}명의 수강생</p><input class="search" placeholder="수강생 이름 검색" aria-label="수강생 검색" value="${esc(search)}" oninput="search=this.value;studentCards()"></div><div id="cards" class="students"></div>`;studentCards()}function studentCards(){$('#cards').innerHTML=data.students.filter(s=>s.name.includes(search)).map(s=>{let p=current(s),n=count(p);return `<article class="student"><div class="row"><h3>${esc(s.name)}</h3><span class="badge">${s.type==='child'?'아이 · 30분':'어른 · 60분'}</span></div><p>${esc(s.subject||'수업 정보 미입력')}</p><div class="progress">${[1,2,3,4].map(i=>`<i class="${i<=n?'fill':''}"></i>`).join('')}</div><div class="row"><b>${n} / 4회 완료</b><small>${data.packages.filter(x=>x.studentId===s.id).length}번째 등록</small></div><p>${esc(s.phone||'연락처 미입력')}</p><p style="margin-top:8px;white-space:pre-wrap">${esc(s.memo)}</p><div class="actions"><button onclick="studentForm('${s.id}')">정보·수강권</button><button class="primary" onclick="lessonForm(null,null,null,'${s.id}')">수업 예약</button></div></article>`}).join('')||'<div class="empty">등록된 수강생이 없습니다.<br>우측 상단에서 수강생을 추가해 주세요.</div>'}
function studentForm(id){let s=id?student(id):{name:'',type:'child',phone:'',subject:'',memo:''};let p=id?current(s):null;openModal(`<h3>${id?'수강생 정보':'새 수강생 등록'}</h3><form id="studentForm"><label>이름<input name="name" required maxlength="60" value="${esc(s.name)}"></label><div class="two"><label>수업 구분<select name="type"><option value="child">아이 · 30분</option><option value="adult" ${s.type==='adult'?'selected':''}>어른 · 60분</option></select></label><label>수업 / 과목<input name="subject" value="${esc(s.subject)}" maxlength="100" placeholder="예: 피아노, 성악"></label></div><label>연락처 / 보호자 연락처<input name="phone" type="tel" value="${esc(s.phone)}" maxlength="60"></label><label>수강생 메모<textarea name="memo" maxlength="1000" placeholder="학습 목표, 준비물, 참고 사항">${esc(s.memo)}</textarea></label>${id?`<div class="message">현재 수강권: <b>${count(p)} / 4회 완료</b><br>등록일 ${p.date} · ${p.paid?'결제 완료':'결제 확인 전'}<br>미완료 예약 ${data.lessons.filter(l=>l.packageId===p.id&&l.status==='scheduled').length}건</div><button type="button" onclick="renew('${id}')">＋ 새 4회 수강권 등록</button><details style="margin-top:14px"><summary>이전 등록 내역</summary>${data.packages.filter(x=>x.studentId===id).map(x=>`<p>${x.date} · ${count(x)}/4회 완료 · ${x.paid?'결제 완료':'결제 확인 전'}</p>`).join('')}</details>`:`<div class="two"><label>등록일<input name="date" type="date" value="${iso(new Date())}" required></label><label>이미 완료한 수업<select name="initial">${[0,1,2,3,4].map(n=>`<option value="${n}">${n}회</option>`).join('')}</select></label></div>`}<label style="margin-top:14px"><input name="paid" type="checkbox" style="width:auto" ${p?.paid?'checked':''}> 현재 수강권 결제 완료</label><div class="actions"><button type="button" onclick="closeModal()">닫기</button><button class="primary">저장</button></div></form>`);$('#studentForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);let obj={id:id||uid(),name:f.get('name').trim(),type:f.get('type'),phone:f.get('phone'),subject:f.get('subject'),memo:f.get('memo')};if(!obj.name)return;if(id){Object.assign(s,obj);p.paid=f.has('paid')}else{data.students.push(obj);data.packages.push({id:uid(),studentId:obj.id,date:f.get('date'),initial:+f.get('initial'),paid:f.has('paid')})}closeModal();save();toast('수강생 정보를 저장했습니다')}}
function renew(id){let s=student(id),p=current(s);if(count(p)<4&&!confirm('현재 수강권에 남은 회차가 있습니다. 기존 수업 기록을 유지하고 새 수강권을 추가할까요?'))return;data.packages.push({id:uid(),studentId:id,date:iso(new Date()),initial:0,paid:false});save();closeModal();studentForm(id)}
function lessonForm(id,day,at,sid){if(!data.students.length){studentForm();return}let l=id?data.lessons.find(x=>x.id===id):{studentId:sid||data.students[0].id,date:day||iso(new Date()),time:at||'14:00',status:'scheduled',memo:''};openModal(`<h3>${id?'수업 상세 · 변경':'수업 등록'}</h3><form id="lessonForm"><label>수강생<select name="student" id="studentSelect" ${id?'disabled':''}>${data.students.map(s=>`<option value="${s.id}" ${s.id===l.studentId?'selected':''}>${esc(s.name)} · ${s.type==='child'?'30분':'60분'}</option>`).join('')}</select></label>${id?'':`<label>수강권<select name="package" id="packageSelect"></select></label>`}<div class="two"><label>수업 날짜<input name="date" type="date" required value="${l.date}"></label><label>시작 시간<input name="time" type="time" required step="1800" value="${l.time}"></label></div>${id?`<label>수업 상태<select name="status"><option value="scheduled" ${l.status==='scheduled'?'selected':''}>예정 · 회차 미차감</option><option value="done" ${l.status==='done'?'selected':''}>완료 · 1회 차감</option><option value="cancel" ${l.status==='cancel'?'selected':''}>취소 · 회차 미차감</option></select></label><div class="message">${l.duration}분 수업 · ${pack(l.packageId).date} 등록 수강권<br>완료를 예정으로 바꾸면 차감한 1회가 복구됩니다.</div>`:`<label>반복 예약<select name="repeat"><option value="1">이번 수업만</option><option value="2">매주 · 총 2회</option><option value="3">매주 · 총 3회</option><option value="4">매주 · 총 4회</option></select></label><div class="message">아이 30분, 어른 60분으로 자동 예약합니다.<br>겹치는 시간과 수강권의 4회 초과 예약은 알려드립니다.</div>`}<label>수업 메모<textarea name="memo" maxlength="1000" placeholder="진도, 준비물, 다음 수업 안내">${esc(l.memo)}</textarea></label><div id="error" role="alert" style="color:#a94c42"></div><div class="actions">${id?`<button type="button" class="danger" onclick="removeLesson('${id}')">삭제</button>`:''}<button type="button" onclick="closeModal()">닫기</button><button class="primary">저장</button></div></form>`);if(!id){let refresh=()=>{$('#packageSelect').innerHTML=data.packages.filter(p=>p.studentId===$('#studentSelect').value).slice().reverse().map(p=>`<option value="${p.id}">${p.date} 등록 · ${count(p)}/4회 완료</option>`).join('')};$('#studentSelect').onchange=refresh;refresh()}$('#lessonForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),s=student(id?l.studentId:f.get('student')),pid=id?l.packageId:f.get('package'),p=pack(pid),n=id?1:+f.get('repeat'),duration=id?l.duration:s.type==='child'?30:60,st=id?f.get('status'):'scheduled';let newLs=Array.from({length:n},(_,i)=>({id:id||uid(),studentId:s.id,packageId:pid,date:iso(plus(date(f.get('date')),7*i)),time:f.get('time'),duration,status:st,memo:f.get('memo')}));let error='';if(minutes(f.get('time'))%30!==0)error='시작 시간은 30분 단위로 선택해 주세요.';if(minutes(f.get('time'))+duration>1440)error='수업은 같은 날짜 안에 끝나야 합니다.';let others=data.lessons.filter(x=>x.id!==id);if(p.initial+others.filter(x=>x.packageId===pid&&x.status!=='cancel').length+newLs.filter(x=>x.status!=='cancel').length>4)error='이 수강권은 예약을 포함해 4회를 초과합니다. 새 수강권을 등록하거나 반복 횟수를 줄여 주세요.';for(let a of newLs)if(a.status!=='cancel'){let conflict=others.find(b=>b.status!=='cancel'&&a.date===b.date&&minutes(a.time)<minutes(b.time)+b.duration&&minutes(b.time)<minutes(a.time)+a.duration);if(conflict)error=`${a.date} ${conflict.time} ${student(conflict.studentId).name} 수업과 시간이 겹칩니다.`}if(error){$('#error').textContent=error;return}data.lessons=others.concat(newLs);closeModal();save();toast(id?'수업 정보를 변경했습니다.':'수업을 예약했습니다.')}}function removeLesson(id){if(!confirm('이 수업을 삭제할까요? 완료된 수업이면 차감 회차도 복구됩니다.'))return;data.lessons=data.lessons.filter(l=>l.id!==id);closeModal();save()}
function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`lesson-note-${iso(new Date())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function validate(d){if(d.version!==1||!Array.isArray(d.students)||!Array.isArray(d.packages)||!Array.isArray(d.lessons))throw Error();let ids=new Set();for(let x of [...d.students,...d.packages,...d.lessons]){if(typeof x.id!=='string'||!/^[a-zA-Z0-9-]+$/.test(x.id)||ids.has(x.id))throw Error();ids.add(x.id)}const validDate=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&!isNaN(date(x))&&iso(date(x))===x;for(let s of d.students){if(typeof s.name!=='string'||!s.name.trim()||!['child','adult'].includes(s.type)||!d.packages.some(p=>p.studentId===s.id))throw Error();for(let k of ['phone','subject','memo'])if(typeof s[k]!=='string')throw Error()}for(let p of d.packages)if(!d.students.some(s=>s.id===p.studentId)||!Number.isInteger(p.initial)||p.initial<0||p.initial>4||!validDate(p.date)||typeof p.paid!=='boolean')throw Error();for(let l of d.lessons){if(!d.packages.some(p=>p.id===l.packageId&&p.studentId===l.studentId)||!validDate(l.date)||!/^([01]\d|2[0-3]):(00|30)$/.test(l.time)||![30,60].includes(l.duration)||minutes(l.time)+l.duration>1440||!['scheduled','done','cancel'].includes(l.status)||typeof l.memo!=='string')throw Error()}for(let p of d.packages)if(p.initial+d.lessons.filter(l=>l.packageId===p.id&&l.status!=='cancel').length>4)throw Error();return d}$('#import').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let incoming=validate(JSON.parse(await file.text()));if(confirm(`수강생 ${incoming.students.length}명, 수업 ${incoming.lessons.length}건으로 현재 데이터를 교체할까요? 먼저 백업하는 것을 권장합니다.`)){data=incoming;save();toast('백업을 복원했습니다.')}}catch(e){alert('올바른 레슨노트 백업 파일이 아닙니다.')}finally{$('#import').value=''}};render();
</script></body></html>
